# XcodeGen spec for the Recallyx macOS app.
#
# This is an *additive*, optional developer convenience: it builds the existing
# macOS app target against the local RecallyxCore SPM package, giving an Xcode
# run/debug path and the foundation for a future iOS target. The shipping macOS
# release path (scripts/bundle.sh + scripts/make-dmg.sh) is unaffected.
#
# Generate the project with:  xcodegen generate
# The generated Recallyx.xcodeproj/ is gitignored (regenerate it any time).
#
# Signing is automatic. The development team is injected only via a local,
# gitignored Local.xcconfig — copy Local.xcconfig.example to Local.xcconfig and
# set your own team id. No team identifier is ever committed.

name: Recallyx

options:
  bundleIdPrefix: io.github.macrosak
  deploymentTarget:
    macOS: "13.0"
    iOS: "26.0"
  createIntermediateGroups: true

configFiles:
  Debug: Local.xcconfig
  Release: Local.xcconfig

packages:
  RecallyxCore:
    path: .

settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    PRODUCT_BUNDLE_IDENTIFIER: io.github.macrosak.recallyx

targets:
  Recallyx:
    type: application
    platform: macOS
    sources:
      - path: Sources/Recallyx
        excludes:
          - Resources/**
      - path: Sources/Recallyx/Resources/AppIcon.icns
        buildPhase: resources
    dependencies:
      - package: RecallyxCore
        product: RecallyxCore
    settings:
      base:
        INFOPLIST_FILE: Sources/Recallyx/Resources/Info.plist
        PRODUCT_NAME: Recallyx
        PRODUCT_BUNDLE_IDENTIFIER: io.github.macrosak.recallyx
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        GENERATE_INFOPLIST_FILE: NO
        # Menu-bar / agent app: no Dock icon (mirrors LSUIElement in Info.plist).
        #
        # CloudKit iCloud sync (opt-in, off by default): the committed
        # entitlements file adds the CloudKit + iCloud-container capability. Its
        # container id is derived from the PUBLIC bundle id and carries NO team
        # identifier, so it's safe to commit. Automatic signing (team from the
        # gitignored Local.xcconfig) provisions the capability at build time.
        # The ad-hoc scripts/bundle.sh release path never applies these, so its
        # CloudKit path stays inert — only the team-signed build reaches iCloud.
        # No app-sandbox: it would break the AX/hotkey/paste paths.
        CODE_SIGN_ENTITLEMENTS: Sources/Recallyx/Resources/Recallyx.entitlements


  # iOS companion app — a second application target on the shared RecallyxCore
  # package. iOS builds are Xcode-only and local; the ad-hoc scripts/bundle.sh +
  # make-dmg.sh + release.yml paths only ever build the macOS Recallyx target.
  # The bundle id is shared with the mac app (one App Store record, two
  # platforms); if App Store Connect ever rejects the shared id for separate
  # submissions, fall back to io.github.macrosak.recallyx.ios.
  RecallyxiOS:
    type: application
    platform: iOS
    sources:
      - path: Sources/RecallyxiOS
        excludes:
          - Resources/**
      - path: Sources/RecallyxiOS/Resources/Assets.xcassets
        buildPhase: resources
    dependencies:
      - package: RecallyxCore
        product: RecallyxCore
    settings:
      base:
        PRODUCT_NAME: Recallyx
        PRODUCT_BUNDLE_IDENTIFIER: io.github.macrosak.recallyx
        INFOPLIST_FILE: Sources/RecallyxiOS/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        # CloudKit + App Group capabilities. The container / group ids derive
        # from the PUBLIC bundle id (no team id); automatic signing (team from
        # the gitignored Local.xcconfig) provisions them at build time.
        CODE_SIGN_ENTITLEMENTS: Sources/RecallyxiOS/Resources/RecallyxiOS.entitlements
        # iPhone only for the MVP.
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
# A shared scheme for the app target. Without it Xcode auto-creates schemes from
# every target, and the name "Recallyx" collides with the RecallyxCore package's
# own `Recallyx` *executable* target — `xcodebuild -scheme Recallyx` then builds
# the bare SPM binary instead of the signed .app bundle. This explicit shared
# scheme wins over the autocreated one, so `-scheme Recallyx` builds the app.
schemes:
  Recallyx:
    build:
      targets:
        Recallyx: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
