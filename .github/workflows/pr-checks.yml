name: PR checks

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: swift test
    runs-on: macos-26
    # A hung test run should fail fast, not burn six hours of runner time.
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Run tests
        # script(1) gives swift test a pty: output is line-buffered, so if a
        # run hangs and times out, the log still shows which test was running
        # (raw pipe output dies unflushed with the process). Exit status is
        # propagated.
        run: script -q /dev/null swift test

  ios-build:
    name: iOS compile gate
    runs-on: macos-26
    # A headless, unsigned iOS-simulator compile of the RecallyxiOS target — it
    # proves RecallyxCore + the app target still build for iOS. CI can't sign or
    # reach CloudKit; real sync verification stays local on device. TestFlight
    # upload is manual off the owner's machine (no App Store Connect secrets).
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        # A blank Local.xcconfig builds unsigned (no team id); it's gitignored, so
        # CI supplies an empty one to satisfy the configFiles reference.
        run: |
          cp Local.xcconfig.example Local.xcconfig
          xcodegen generate

      - name: Build RecallyxiOS (simulator, signing off)
        run: |
          xcodebuild -project Recallyx.xcodeproj -scheme RecallyxiOS \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build
